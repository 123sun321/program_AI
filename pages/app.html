<style>
:root{
  --primary:#409eff;--primary-dark:#337ecc;--success:#67c23a;--warning:#e6a23c;--danger:#f56c6c;
  --text:#303133;--text-reg:#606266;--text-sec:#909399;--border:#e4e7ed;--border-l:#ebeef5;
  --bg:#f5f7fa;--white:#fff;--side:#304156;--side-dark:#2b3a4d;--side-text:#bfcbd9;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.6}
a{text-decoration:none;color:inherit}
button,input,select{font-family:inherit;font-size:inherit}
.el-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border:1px solid var(--border);border-radius:4px;background:#fff;color:var(--text-reg);cursor:pointer;transition:.15s;font-size:14px}
.el-btn:hover{color:var(--primary);border-color:var(--primary);background:#ecf5ff}
.el-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.el-btn.primary:hover{background:var(--primary-dark);border-color:var(--primary-dark)}
.el-btn.danger{color:var(--danger);border-color:#fbc4c4}
.el-btn.sm{padding:6px 12px;font-size:12.5px}
.el-tag{display:inline-block;padding:2px 9px;border-radius:4px;font-size:12px;line-height:20px}
.el-tag.blue{background:#ecf5ff;color:var(--primary);border:1px solid #d9ecff}
.el-tag.green{background:#f0f9eb;color:var(--success);border:1px solid #e1f3d8}
.el-tag.orange{background:#fdf6ec;color:var(--warning);border:1px solid #faecd8}
.el-tag.red{background:#fef0f0;color:var(--danger);border:1px solid #fde2e2}
.el-tag.gray{background:#f4f4f5;color:var(--text-sec);border:1px solid #e9e9eb}

/* ============ 登录页 ============ */
#login{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0f2038 0%,#1e4a8a 45%,#0891b2 100%)}
.login-box{width:400px;max-width:92vw;background:#fff;border-radius:8px;padding:38px 36px 30px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.login-hd{text-align:center;margin-bottom:26px}
.login-hd .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:6px}
.login-hd .brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#0891b2);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(37,99,235,.25)}
.login-hd .brand-mark svg{width:22px;height:22px}
.login-hd .brand-name{font-size:21px;font-weight:700;color:#1e293b;letter-spacing:1px}
.login-hd .brand-name span{color:var(--primary)}
.login-hd p{color:var(--text-sec);font-size:12.5px;letter-spacing:1px}
.role-tabs{display:flex;background:#f5f7fa;border-radius:6px;padding:3px;margin-bottom:22px}
.role-tab{flex:1;text-align:center;padding:8px 0;border-radius:4px;cursor:pointer;color:var(--text-reg);font-size:13.5px;transition:.15s}
.role-tab.active{background:#fff;color:var(--primary);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--text-reg);margin-bottom:7px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:4px;outline:0;transition:.15s}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(64,158,255,.12)}
.login-box .el-btn{width:100%;padding:12px;font-size:15px;margin-top:4px}
.quick{background:#f5f7fa;border-radius:6px;padding:12px 14px;margin-top:20px;font-size:12.5px;color:var(--text-sec);line-height:1.9}
.quick b{color:var(--text-reg)}
.login-tip{text-align:center;margin-top:16px;font-size:12px;color:var(--text-sec)}
.login-tip a{color:var(--primary)}

/* ============ 主框架 ============ */
#app{display:none;min-height:100vh}
#app.show{display:block}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:210px;background:var(--side);color:var(--side-text);z-index:50;display:flex;flex-direction:column;transition:transform .25s}
.logo-bar{height:56px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.logo-bar .brand{display:flex;align-items:center;gap:10px}
.logo-bar .brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#22d3ee);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-bar .brand-mark svg{width:18px;height:18px}
.logo-bar .brand-name{font-size:17px;font-weight:700;color:#fff;letter-spacing:1px}
.menu{flex:1;overflow-y:auto;padding:10px 0}
.menu-group{padding:12px 20px 6px;font-size:11px;color:#7b8ca3;letter-spacing:.5px}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:var(--side-text);font-size:14px;border-left:3px solid transparent;transition:.15s}
.menu-item:hover{background:var(--side-dark);color:#fff}
.menu-item.active{background:var(--side-dark);color:#fff;border-left-color:var(--primary)}
.menu-item .ico{width:18px;text-align:center;font-size:15px;opacity:.85}
.side-foot{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#7b8ca3}
.main-wrap{margin-left:210px;min-height:100vh;transition:margin .25s}
.navbar{height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 22px;position:sticky;top:0;z-index:40;gap:16px}
.menu-toggle{display:none;background:none;border:0;font-size:20px;cursor:pointer;color:var(--text-reg)}
.crumb{color:var(--text-sec);font-size:13px}
.crumb b{color:var(--text-reg);font-weight:400}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:16px}
.bell{position:relative;font-size:18px;cursor:pointer;color:var(--text-reg)}
.bell::after{content:"3";position:absolute;top:-6px;right:-8px;background:var(--danger);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.user-chip{display:flex;align-items:center;gap:9px;cursor:pointer}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#409eff,#67c23a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.user-chip .nm{font-size:13.5px;color:var(--text-reg)}
.page{padding:22px}
.page-hd{margin-bottom:18px}
.page-hd h2{font-size:20px;font-weight:600;color:var(--text)}
.page-hd .sub{color:var(--text-sec);font-size:13px;margin-top:3px}

/* ============ 通用卡片/统计 ============ */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat-card{background:#fff;border:1px solid var(--border-l);border-radius:6px;padding:18px 20px;display:flex;align-items:center;gap:15px}
.stat-ic{width:52px;height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex-shrink:0}
.stat-ic.b{background:linear-gradient(135deg,#409eff,#66b1ff)}
.stat-ic.g{background:linear-gradient(135deg,#67c23a,#85ce61)}
.stat-ic.o{background:linear-gradient(135deg,#e6a23c,#ebb563)}
.stat-ic.r{background:linear-gradient(135deg,#f56c6c,#f78989)}
.stat-ic.p{background:linear-gradient(135deg,#9b59b6,#b37feb)}
.stat-num{font-size:26px;font-weight:700;color:var(--text);line-height:1.2}
.stat-lbl{color:var(--text-sec);font-size:12.5px;margin-top:2px}
.panel{background:#fff;border:1px solid var(--border-l);border-radius:6px;margin-bottom:18px}
.panel-hd{padding:15px 20px;border-bottom:1px solid var(--border-l);display:flex;align-items:center;gap:8px}
.panel-hd h3{font-size:15px;font-weight:600}
.panel-hd .extra{margin-left:auto;color:var(--text-sec);font-size:12.5px}
.panel-bd{padding:20px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-2-3{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}

/* ============ 表格 ============ */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:#fafafa;color:var(--text-reg);font-weight:600;text-align:left;padding:11px 14px;border-bottom:1px solid var(--border-l);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--border-l);color:var(--text-reg)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#f5f7fa}

/* ============ 图表（纯CSS/SVG）============ */
.bars{display:flex;align-items:flex-end;gap:14px;height:200px;padding:10px 0 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar-col .v{font-size:11px;color:var(--text-sec)}
.bar-col .bar{width:60%;max-width:42px;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#409eff,#79bbff);transition:height .5s}
.bar-col .lbl{font-size:11.5px;color:var(--text-sec);white-space:nowrap}
.donut{display:flex;align-items:center;gap:24px;justify-content:center;padding:10px 0}
.donut-chart{width:150px;height:150px;border-radius:50%;flex-shrink:0}
.donut-legend{font-size:13px}
.donut-legend div{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ============ 在线编程 ============ */
.code-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}
.code-editor{background:#1e293b;border-radius:6px;overflow:hidden;display:flex;min-height:380px}
.code-ln{font-family:Consolas,monospace;font-size:13px;line-height:1.6;color:#5b6b85;text-align:right;padding:14px 10px;background:#182236;user-select:none;white-space:pre;border-right:1px solid #2a3852}
.code-area{flex:1;resize:none;border:0;outline:0;background:#1e293b;color:#e2e8f0;font-family:Consolas,monospace;font-size:13px;line-height:1.6;padding:14px;tab-size:2;white-space:pre;overflow:auto}
.console{background:#fff;border:1px solid var(--border-l);border-radius:6px;min-height:200px;max-height:320px;overflow:auto}
.console-hd{padding:10px 14px;border-bottom:1px solid var(--border-l);font-size:13px;color:var(--text-reg);display:flex;align-items:center;gap:8px}
.console-hd .st{margin-left:auto;font-size:12px}
.console-bd{padding:8px 0;font-family:Consolas,monospace;font-size:12.5px}
.con-line{padding:4px 14px;white-space:pre-wrap;word-break:break-word;border-bottom:1px solid #f5f7fa}
.con-line.error{color:var(--danger);background:#fef0f0}
.con-line.info{color:var(--primary)}
.con-line.warn{color:var(--warning);background:#fdf6ec}
.timeline{padding-left:8px;max-height:300px;overflow:auto}
.tl-item{position:relative;padding:0 0 16px 26px;border-left:2px solid var(--border-l);margin-left:8px}
.tl-item:last-child{border-left-color:transparent}
.tl-item::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl-item.err::before{border-color:var(--danger)}
.tl-item.ok::before{border-color:var(--success)}
.tl-item .tt{font-size:11.5px;color:var(--text-sec)}
.tl-item .th{font-size:13px;color:var(--text-reg);margin-top:1px}

/* ============ 提示条 ============ */
.notice{background:#ecf5ff;border:1px solid #d9ecff;color:#3a7abd;border-radius:6px;padding:12px 16px;margin-bottom:18px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.notice .ni{font-size:16px;flex-shrink:0}
@media(max-width:1050px){.stat-row{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-2-3,.code-layout{grid-template-columns:1fr}}
@media(max-width:760px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main-wrap{margin-left:0}.menu-toggle{display:block}
  .stat-row{grid-template-columns:1fr 1fr}
}
</style>
</head>

    t.classList.add('active'); curRole=t.getAttribute('data-role');

    $('loginUser').value=a.user; $('loginPwd').value=a.pwd;

// 初始化默认选中学生端并填账号
(function(){ var t=document.querySelector('.role-tab.active'); t.click(); })();

function doLogin(){
  var u=$('loginUser').value.trim(), p=$('loginPwd').value;
  var match=null;
  for(var k in ACCOUNTS){ if(ACCOUNTS[k].user===u && ACCOUNTS[k].pwd===p){ match=ACCOUNTS[k]; break; } }
  if(!match){
    $('loginPwd').style.borderColor='var(--danger)';
    $('quickTip').innerHTML='<span style="color:var(--danger)">账号或密码错误，请使用下方演示账号。</span><br>'+QUICK[curRole];
    return;
  }
  $('loginPwd').style.borderColor='';
  curUser=match; curRole=match.role;
  $('login').style.display='none'; $('app').classList.add('show');
  $('avatar').textContent=match.name.charAt(0);
  $('userName').textContent=match.name+'（'+match.label+'）';
  buildMenu(); navigate('home');
}
$('loginBtn').onclick=doLogin;
$('loginForm').addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });
$('logoutBtn').onclick=function(){
  if(!confirm('确定退出登录？')) return;
  $('app').classList.remove('show'); $('login').style.display='flex'; curUser=null;
};
$('menuToggle').onclick=function(){ $('sidebar').classList.toggle('open'); };

/* ============ 菜单与路由 ============ */
function buildMenu(){
  var m=$('menu'); m.innerHTML='';
  MENUS[curRole].forEach(function(item){
    if(item.group){ var g=document.createElement('div'); g.className='menu-group'; g.textContent=item.group; m.appendChild(g); return; }
    var d=document.createElement('div'); d.className='menu-item'; d.setAttribute('data-id',item.id);
    d.innerHTML='<span class="ico">'+item.ico+'</span><span>'+item.name+'</span>';
    d.onclick=function(){ navigate(item.id); $('sidebar').classList.remove('open'); };
    m.appendChild(d);
  });
}
function menuName(id){
  var f=MENUS[curRole].filter(function(x){return x.id===id});
  return f.length?f[0].name:'工作台';
}
function navigate(id){
  document.querySelectorAll('.menu-item').forEach(function(x){ x.classList.toggle('active',x.getAttribute('data-id')===id); });
  $('crumbCur').textContent=menuName(id);
  window._curPage=id;
  var r=PAGES[curRole][id]||PAGES.fallback;
  $('page').innerHTML=r();
  if(id==='editor') initEditor();
  window.scrollTo(0,0);
}

/* ============ 过程事件存储 ============ */
var EKEY='zx_app_events_v1';
function LOAD_EVENTS(){ try{ var a=JSON.parse(localStorage.getItem(EKEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function ADD_EVENT(e){ var a=LOAD_EVENTS(); e.time=new Date().toLocaleTimeString('zh-CN',{hour12:false}); a.push(e); try{localStorage.setItem(EKEY,JSON.stringify(a.slice(-200)))}catch(err){} }

/* ============ 在线编程引擎 ============ */
var WORKER_SRC=[
'const fmt=(v,d)=>{if(d>3)return "…";if(v===undefined)return "undefined";if(v===null)return "null";if(typeof v==="string")return v;if(typeof v==="function")return "[Function "+(v.name||"anonymous")+"]";if(typeof v==="object"){const seen=new WeakSet();try{return JSON.stringify(v,(k,val)=>{if(typeof val==="function")return "[Function]";if(val&&typeof val==="object"){if(seen.has(val))return "[Circular]";seen.add(val);}return val;});}catch(e){return String(v);}}return String(v);};',
'let logs=[];const push=(lv,a)=>{logs.push({level:lv,text:Array.from(a).map(x=>fmt(x,0)).join(" ")});};',
'console.log=(...a)=>push("log",a);console.info=(...a)=>push("info",a);console.warn=(...a)=>push("warn",a);console.error=(...a)=>push("error",a);',
'onmessage=function(e){logs=[];const t0=Date.now();try{(new Function(e.data))();postMessage({ok:true,logs:logs,ms:Date.now()-t0});}catch(err){postMessage({ok:false,logs:logs,ms:Date.now()-t0,err:{name:err.name,message:err.message,stack:(err.stack||"").split("\\n").slice(0,5).join("\\n")}});}};'
].join('\n');

function runInWorker(code){
  return new Promise(function(resolve){
    var url;try{url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'application/javascript'}))}catch(e){resolve({ok:false,logs:[],err:{name:'EnvError',message:'浏览器不支持'}});return}
    var w;try{w=new Worker(url)}catch(e){URL.revokeObjectURL(url);resolve({ok:false,logs:[],err:{name:'EnvError',message:'请用系统浏览器打开本网址'}});return}
    var done=false;
    var timer=setTimeout(function(){if(!done){done=true;w.terminate();URL.revokeObjectURL(url);resolve({ok:false,logs:[],err:{name:'TimeoutError',message:'执行超时，可能存在死循环'}});}},3000);
    w.onmessage=function(e){if(done)return;done=true;clearTimeout(timer);w.terminate();URL.revokeObjectURL(url);resolve(e.data)};
    w.onerror=function(e){if(done)return;done=true;clearTimeout(timer);w.terminate();URL.revokeObjectURL(url);resolve({ok:false,logs:[],err:{name:'WorkerError',message:e.message||'运行错误'}})};
    w.postMessage(code);
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function initEditor(){
  var area=$('codeArea'), ln=$('codeLn'), btn=$('codeRun');
  if(!area) return;
  function updLn(){var n=area.value.split('\n').length,s='';for(var i=1;i<=n;i++)s+=i+(i<n?'\n':'');ln.textContent=s;ln.scrollTop=area.scrollTop;}
  area.addEventListener('input',function(){updLn()});
  area.addEventListener('scroll',function(){ln.scrollTop=area.scrollTop});
  area.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=this.selectionStart,t=this.selectionEnd;this.value=this.value.slice(0,s)+'  '+this.value.slice(t);this.selectionStart=this.selectionEnd=s+2;updLn();}});
  updLn();
  $('codeReset').onclick=function(){area.value='// 计算 1 到 10 的和\nlet sum = 0;\nfor (let i = 1; i <= 10; i++) {\n  sum += i;\n}\nconsole.log("1 到 10 的和 =", sum);';updLn();$('consoleBd').innerHTML='<div class="con-line" style="color:var(--text-sec)">已重置</div>';};
  btn.onclick=function(){
    var code=area.value;
    btn.disabled=true;btn.textContent='⏳ 运行中';$('runStat').textContent='执行中…';
    runInWorker(code).then(function(r){
      ADD_EVENT({type:'run',ok:r.ok,err:r.err?r.err.name:null});
      // 输出
      var cb=$('consoleBd');cb.innerHTML='';
      if(!r.logs||!r.logs.length) cb.innerHTML='<div class="con-line" style="color:var(--text-sec)">（无输出，试试 console.log()）</div>';
      else r.logs.forEach(function(l){var d=document.createElement('div');d.className='con-line '+(l.level==='error'?'error':l.level==='warn'?'warn':l.level==='info'?'info':'');d.textContent=l.text;cb.appendChild(d)});
      if(r.ok) $('runStat').innerHTML='<span class="el-tag green">成功 '+(r.ms||0)+'ms</span>';
      else $('runStat').innerHTML='<span class="el-tag red">失败 · '+esc(r.err.name)+'</span>';
      // 反馈
      renderFeedback(r);
      // 轨迹
      renderTinyTimeline();
      btn.disabled=false;btn.textContent='▶ 运行';
    });
  };
  renderTinyTimeline();
}
function renderFeedback(r){
  var box=$('fbBox');if(!box)return;
  if(r.ok){
    var n=(r.logs||[]).length;
    box.innerHTML='<div style="padding:12px;background:#f0f9eb;border-left:4px solid var(--success);border-radius:4px"><b style="color:var(--success)">✓ 运行成功</b><div style="color:var(--text-reg);margin-top:6px;font-size:13px">'+(n?('产生 '+n+' 行输出，耗时 '+(r.ms||0)+' ms。逻辑跑通，继续尝试更复杂的练习。'):'代码执行成功但无输出，建议用 console.log() 打印关键变量验证结果。')+'</div></div>';
  }else{
    var map={SyntaxError:['语法错误','括号/引号未配对、缺少分号或用了中文标点。','检查报错行附近的符号，改用英文半角。'],ReferenceError:['变量未定义','使用了未声明的变量，可能拼写错误。','使用前先 let 声明并赋值，核对拼写。'],TypeError:['类型错误','对某个值做了它不支持的操作。','先 console.log() 打印该值确认类型。'],TimeoutError:['执行超时','循环可能没有正确退出条件。','检查 while/for 的循环变量变化与跳出条件。']};
    var e=map[r.err.name]||['运行错误',r.err.message,'根据错误信息逐步排查。'];
    box.innerHTML='<div style="padding:12px;background:#fef0f0;border-left:4px solid var(--danger);border-radius:4px"><b style="color:var(--danger)">✕ '+e[0]+'（'+esc(r.err.name)+'）</b><div style="color:var(--text-reg);margin-top:6px;font-size:13px">'+e[1]+'</div><div style="color:var(--text-sec);margin-top:6px;font-size:12.5px">💡 '+e[2]+'</div></div>';
  }
}
function renderTinyTimeline(){
  var box=$('tlBox');if(!box)return;
  var evs=LOAD_EVENTS().slice(-8).reverse();
  if(!evs.length){box.innerHTML='<div style="color:var(--text-sec);font-size:13px">你的编辑与运行记录会实时显示在这里。</div>';return}
  box.innerHTML='<div class="timeline">'+evs.map(function(e){
    return '<div class="tl-item '+(e.type==='run'?(e.ok?'ok':'err'):'')+'"><div class="tt">'+e.time+'</div><div class="th">'+(e.type==='run'?(e.ok?'▶ 运行成功':'▶ 运行失败 · '+esc(e.err||'')):'✎ 编辑代码')+'</div></div>';
  }).join('')+'</div>';
}
